<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="Prompductor">
<meta name="description" content="Prompductor - Suno/Udio prompt olusturucu">
<title>Prompductor</title>
<style>
  * { font-weight: normal; font-style: normal; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000000; color: #e0e0e0; font-family: Arial, Helvetica, sans-serif; font-size: 18px; line-height: 1.6; }
  body { min-height: 100vh; padding: 20px 16px 40px; }
  main { max-width: 960px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .brand { font-size: 1.9em; letter-spacing: 0.06em; color: #e0e0e0; margin: 0; line-height: 1.2; }
  .tagline { color: #999999; margin: 2px 0 0 0; font-size: 0.95em; }
  .lang { display: inline-flex; border: 1px solid #262626; border-radius: 10px; overflow: hidden; background: #0d0d0d; }
  .lang button { min-width: 72px; min-height: 52px; border: 0; border-radius: 0; background: #0d0d0d; color: #999999; font-size: 1em; padding: 12px 18px; }
  .lang button[aria-pressed="true"] { background: #3a2c00; color: #ffd84a; box-shadow: inset 0 -4px 0 #ffb800; }
  .lang button:hover:not([aria-pressed="true"]) { background: #1c1c1c; }
  .stepper { display: flex; justify-content: space-between; gap: 6px; margin: 6px 0 18px 0; padding: 0; list-style: none; }
  .stepper li { flex: 1; text-align: center; color: #666666; font-size: 0.85em; padding: 10px 2px; border-bottom: 3px solid #1c1c1c; }
  .stepper li .n { display: block; font-size: 1.1em; color: #666666; }
  .stepper li.done { color: #d9a400; border-bottom-color: #6b5210; }
  .stepper li.current { color: #ffd84a; border-bottom-color: #ffd84a; }
  .stepper li.current .n { color: #ffd84a; }
  .progress-text { color: #999999; font-size: 0.92em; text-align: center; margin: 0 0 10px 0; }
  h2 { font-size: 1.15em; color: #e0e0e0; margin: 0 0 12px 0; }
  .muted { color: #999999; margin: 4px 0 8px 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  #stage { position: relative; }
  .step { display: none; }
  .step.active { display: block; animation: step-in 0.32s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes step-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .card { background: #0d0d0d; border: 1px solid #262626; border-radius: 10px; padding: 16px; margin-top: 12px; transition: background 0.28s ease, border-color 0.28s ease; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
  .pair > .card { margin-top: 0; }
  .top-bar { display: flex; justify-content: flex-start; margin-bottom: 6px; }
  button { font-family: inherit; font-size: 1em; padding: 12px 18px; min-height: 52px; background: #141414; color: #e0e0e0; border: 1px solid #262626; border-radius: 10px; cursor: pointer; transition: background 0.28s ease, border-color 0.28s ease, color 0.2s ease; }
  button:hover:not(:disabled) { background: #1c1c1c; border-color: #3a3a3a; }
  button:focus-visible { outline: 3px solid #ffb800; outline-offset: 2px; }
  button:disabled { color: #6b6b6b; cursor: not-allowed; border-color: #1c1c1c; }
  .icon { display: inline-block; width: 1.2em; text-align: center; margin-right: 6px; color: #999999; }
  .btn-lg { min-height: 56px; min-width: 220px; font-size: 1.1em; background: #1a1a1a; border-color: #5a5a5a; }
  .btn-lg:hover:not(:disabled) { background: #242424; border-color: #6a6a6a; }
  .next-wrap { display: flex; justify-content: center; margin-top: 18px; }
  .next-btn[hidden] { display: none; }
  svg.check { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: #ffd84a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
  .dd-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: #141414; min-height: 60px; padding: 12px 16px; }
  .dd-text { display: flex; flex-direction: column; min-width: 0; }
  .dd-cap { color: #999999; font-size: 0.85em; }
  .dd-value { color: #e0e0e0; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dd-arrow { color: #999999; flex-shrink: 0; display: inline-block; transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1); }
  .dd-toggle[aria-expanded="true"] { background: var(--open-bg); border-color: var(--open-border); }
  .dd-toggle[aria-expanded="true"] .dd-arrow { transform: rotate(180deg); }
  .dd-toggle.is-selected[aria-expanded="false"] { background: #3a2c00; border: 2px solid #ffb800; box-shadow: inset 5px 0 0 #ffd84a; }
  .dd-toggle.is-selected[aria-expanded="false"] .dd-value { color: #ffd84a; }
  .dd-toggle.is-selected[aria-expanded="false"] .dd-cap { color: #ffcc33; }
  .dd-toggle.is-selected[aria-expanded="false"] .dd-arrow { color: #ffd84a; }
  .dd-toggle:disabled .dd-value, .dd-toggle:disabled .dd-cap { color: #6b6b6b; }
  .dd-panel { display: grid; grid-template-rows: 0fr; opacity: 0; transform: translateY(-4px); transition: grid-template-rows 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), transform 0.28s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 10px; }
  .dd-panel.open { grid-template-rows: 1fr; opacity: 1; transform: translateY(0); }
  .dd-inner { min-height: 0; overflow: hidden; border-radius: 10px; }
  .dd-panel.open .dd-inner { border: 1px solid var(--open-border); background: var(--open-bg); max-height: 380px; overflow-y: auto; }
  .opt-list { list-style: none; margin: 0; padding: 0; }
  .opt-list li + li { border-top: 1px solid var(--row-sep, #1c1c1c); }
  .opt { width: 100%; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; min-height: 56px; }
  .opt:hover:not(:disabled), .opt:focus-visible { background: #1c1c1c; }
  .opt[aria-checked="true"] { background: #3a2c00; box-shadow: inset 6px 0 0 #ffd84a; }
  .opt[aria-checked="true"] .opt-title { color: #ffd84a; }
  .opt[aria-checked="true"] .opt-desc { color: #ffcc33; }
  .opt-text { display: block; min-width: 0; }
  .opt-title { display: block; color: #e0e0e0; }
  .opt-desc { display: block; color: #999999; font-size: 0.9em; margin-top: 2px; }
  .opt-check { visibility: hidden; margin-top: 3px; }
  .opt[aria-checked="true"] .opt-check { visibility: visible; }
  .sel-line { color: #999999; margin: 10px 0 0 0; }
  .sel-line.is-set { color: #ffd84a; }
  .locked-note { color: #999999; font-size: 0.92em; margin: 6px 0 0 0; }
  .choice-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .choice { width: 100%; text-align: left; padding: 16px; min-height: 72px; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #0d0d0d; }
  .choice[aria-checked="true"] { background: #3a2c00; border: 2px solid #ffb800; box-shadow: inset 6px 0 0 #ffd84a; }
  .choice[aria-checked="true"] .opt-title { color: #ffd84a; }
  .choice .opt-check { visibility: hidden; }
  .choice[aria-checked="true"] .opt-check { visibility: visible; }
  .status { min-height: 1.5em; color: #999999; margin-top: 14px; text-align: center; }
  .summary-list { list-style: none; padding: 0; margin: 0; }
  .summary-list li { padding: 8px 0; border-bottom: 1px solid #1c1c1c; color: #e0e0e0; }
  .summary-list .k { color: #999999; display: inline-block; min-width: 190px; }
  #gen-loader { display: none; text-align: center; padding: 40px 12px; }
  #gen-loader.active { display: block; animation: step-in 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  .bars { display: flex; justify-content: center; align-items: flex-end; gap: 10px; height: 64px; margin-bottom: 20px; }
  .bars span { display: block; width: 10px; height: 18px; background: #3a3a3a; border-radius: 3px; animation: bar-rise 1.6s ease-in-out infinite; }
  .bars span:nth-child(2) { animation-delay: 0.2s; background: #444444; }
  .bars span:nth-child(3) { animation-delay: 0.4s; }
  .bars span:nth-child(4) { animation-delay: 0.6s; background: #444444; }
  @keyframes bar-rise { 0%, 100% { height: 18px; opacity: 0.55; } 50% { height: 60px; opacity: 1; } }
  .loader-text { color: #999999; min-height: 1.6em; }
  #gen-result { display: none; }
  #gen-result.active { display: block; animation: step-in 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  .block-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .prompt-label { color: #999999; font-size: 0.92em; margin: 12px 0 6px 0; display: block; }
  .prompt-box { width: 100%; min-height: 150px; background: #080808; color: #e0e0e0; border: 1px solid #262626; border-radius: 10px; padding: 14px; font-family: Consolas, Menlo, monospace; font-size: 0.95em; line-height: 1.5; resize: vertical; }
  .prompt-box:focus-visible { outline: 3px solid #ffb800; outline-offset: 2px; }
  .copy-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 16px; }
  .copy-row button { min-height: 56px; min-width: 200px; }
  .copy-btn.copied { background: #3a2c00; border-color: #ffb800; color: #ffd84a; }
  .action-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 18px; }
  .action-row button { min-height: 56px; min-width: 220px; }
  .tone-genre { --open-bg: #0e1713; --open-border: #1a3024; --row-sep: #1a3024; }
  .tone-tempo { --open-bg: #0e131a; --open-border: #1d2836; --row-sep: #1d2836; }
  .tone-mood  { --open-bg: #170e17; --open-border: #301a30; --row-sep: #301a30; }
  .tone-vocal { --open-bg: #17130e; --open-border: #30241a; --row-sep: #30241a; }
  .tone-fx    { --open-bg: #0e1617; --open-border: #1a2f30; --row-sep: #1a2f30; }
  .tone-mix   { --open-bg: #170e10; --open-border: #301a1e; --row-sep: #301a1e; }
  .tone-scen  { --open-bg: #13170e; --open-border: #24301a; --row-sep: #24301a; }
  .tone-makam { --open-bg: #0e1017; --open-border: #1f2433; --row-sep: #1f2433; }
  .tone-nota  { --open-bg: #14101a; --open-border: #2a1f38; --row-sep: #2a1f38; }
  @media (max-width: 520px) {
    .brand { font-size: 1.5em; }
    .lang button { min-width: 60px; padding: 12px 12px; }
    .stepper li { font-size: 0.75em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .step.active, #gen-loader.active, #gen-result.active, .bars span { animation: none; }
    .dd-panel, .dd-arrow, .card, button { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1 class="brand">Prompductor</h1>
      <p class="tagline" id="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Dil / Language">
      <button type="button" id="lang-tr" aria-pressed="true" lang="tr">TR</button>
      <button type="button" id="lang-en" aria-pressed="false" lang="en">EN</button>
    </div>
  </div>
  <ol class="stepper" id="stepper"></ol>
  <p class="progress-text" id="progress" aria-live="polite"></p>
  <div id="stage">
    <section class="step active" id="s1" aria-labelledby="s1-title">
      <div class="card tone-genre" id="genre-card">
        <h2 id="s1-title" tabindex="-1"><span class="icon" aria-hidden="true">&#9834;</span><span data-i18n="s1title"></span></h2>
        <button type="button" class="dd-toggle" id="genre-toggle" aria-expanded="false" aria-controls="genre-panel">
          <span class="dd-text"><span class="dd-cap" data-i18n="genreCap"></span><span class="dd-value" id="genre-value"></span></span>
          <span class="dd-arrow" aria-hidden="true">&#9662;</span>
        </button>
        <div class="dd-panel" id="genre-panel"><div class="dd-inner"><ul class="opt-list" id="genre-list" role="radiogroup" aria-labelledby="s1-title"></ul></div></div>
      </div>
      <div class="next-wrap"><button type="button" class="btn-lg next-btn" id="next-1" hidden></button></div>
    </section>
    <section class="step" id="s2" aria-labelledby="s2-title">
      <div class="top-bar"><button type="button" id="back-2"></button></div>
      <h2 id="s2-title" tabindex="-1"><span class="icon" aria-hidden="true">&#9719;</span><span data-i18n="s2title"></span></h2>
      <p class="muted" id="s2-summary"></p>
      <div class="pair">
        <div class="card tone-tempo" id="tempo-card">
          <h2 id="tempo-title"><span class="icon" aria-hidden="true">&#9201;</span><span data-i18n="tempoTitle"></span></h2>
          <button type="button" class="dd-toggle" id="tempo-toggle" aria-expanded="false" aria-controls="tempo-panel">
            <span class="dd-text"><span class="dd-cap" data-i18n="tempoCap"></span><span class="dd-value" id="tempo-value"></span></span>
            <span class="dd-arrow" aria-hidden="true">&#9662;</span>
          </button>
          <div class="dd-panel" id="tempo-panel"><div class="dd-inner"><ul class="opt-list" id="tempo-list" role="radiogroup" aria-labelledby="tempo-title"></ul></div></div>
        </div>
        <div class="card tone-mood" id="mood-card">
          <h2 id="mood-title"><span class="icon" aria-hidden="true">&#9680;</span><span data-i18n="moodTitle"></span></h2>
          <button type="button" class="dd-toggle" id="mood-toggle" aria-expanded="false" aria-controls="mood-panel">
            <span class="dd-text"><span class="dd-cap" data-i18n="moodCap"></span><span class="dd-value" id="mood-value"></span></span>
            <span class="dd-arrow" aria-hidden="true">&#9662;</span>
          </button>
          <div class="dd-panel" id="mood-panel"><div class="dd-inner"><ul class="opt-list" id="mood-list" role="radiogroup" aria-labelledby="mood-title"></ul></div></div>
        </div>
      </div>
      <div class="next-wrap"><button type="button" class="btn-lg next-btn" id="next-2" disabled></button></div>
    </section>
    <section class="step" id="s3" aria-labelledby="s3-title">
      <div class="top-bar"><button type="button" id="back-3"></button></div>
      <h2 id="s3-title" tabindex="-1"><span class="icon" aria-hidden="true">&#9835;</span><span data-i18n="s3title"></span></h2>
      <div class="card tone-vocal" id="vocal-card">
        <h2 id="vocal-title"><span class="icon" aria-hidden="true">&#9834;</span><span data-i18n="vocalTitle"></span></h2>
        <div class="choice-row" role="radiogroup" aria-labelledby="vocal-title">
          <button type="button" class="choice" id="vocal-yes" role="radio" aria-checked="false">
            <span class="opt-text"><span class="opt-title" id="vocal-yes-t"></span><span class="opt-desc" id="vocal-yes-d"></span></span>
            <span class="opt-check" aria-hidden="true"><svg class="check" viewBox="0 0 24 24" focusable="false"><polyline points="4 12 9 17 20 6"></polyline></svg></span>
          </button>
          <button type="button" class="choice" id="vocal-no" role="radio" aria-checked="false">
            <span class="opt-text"><span class="opt-title" id="vocal-no-t"></span><span class="opt-desc" id="vocal-no-d"></span></span>
            <span class="opt-check" aria-hidden="true"><svg class="check" viewBox="0 0 24 24" focusable="false"><polyline points="4 12 9 17 20 6"></polyline></svg></span>
          </button>
        </div>
        <p class="sel-line" id="vocal-sel" aria-live="polite"></p>
      </div>
      <div class="pair">
        <div class="card tone-vocal" id="vt-card">
          <h2 id="vt-title"><span class="icon" aria-hidden="true">&#9836;</span><span data-i18n="vtTitle"></span></h2>
          <button type="button" class="dd-toggle" id="vt-toggle" aria-expanded="false" aria-controls="vt-panel" aria-describedby="vt-note">
            <span class="dd-text"><span class="dd-cap" data-i18n="vtCap"></span><span class="dd-value" id="vt-value"></span></span>
            <span class="dd-arrow" aria-hidden="true">&#9662;</span>
          </button>
          <p class="locked-note" id="vt-note"></p>
          <div class="dd-panel" id="vt-panel"><div class="dd-inner"><ul class="opt-list" id="vt-list" role="radiogroup" aria-labelledby="vt-title"></ul></div></div>
        </div>
        <div class="card tone-fx" id="fx-card">
          <h2 id="fx-title"><span class="icon" aria-hidden="true">&#10070;</span><span data-i18n="fxTitle"></span></h2>
          <button type="button" class="dd-toggle" id="fx-toggle" aria-expanded="false" aria-controls="fx-panel">
            <span class="dd-text"><span class="dd-cap" data-i18n="fxCap"></span><span class="dd-value" id="fx-value"></span></span>
            <span class="dd-arrow" aria-hidden="true">&#9662;</span>
          </button>
          <div class="dd-panel" id="fx-panel"><div class="dd-inner"><ul class="opt-list" id="fx-list" role="radiogroup" aria-labelledby="fx-title"></ul></div></div>
        </div>
      </div>
      <div class="next-wrap"><button type="button" class="btn-lg next-btn" id="next-3" disabled></button></div>
    </section>
    <section class="step" id="s4" aria-labelledby="s4-title">
      <div class="top-bar"><button type="button" id="back-4"></button></div>
      <h2 id="s4-title" tabindex="-1"><span class="icon" aria-hidden="true">&#9881;</span><span data-i18n="s4title"></span></h2>
      <p class="muted" id="s4-note"></p>
      <div class="pair">
        <div class="card tone-mix" id="mix-card">
          <h2 id="mix-title"><span class="icon" aria-hidden="true">&#9881;</span><span data-i18n="mixTitle"></span></h2>
          <button type="button" class="dd-toggle" id="mix-toggle" aria-expanded="false" aria-controls="mix-panel">
            <span class="dd-text"><span class="dd-cap" data-i18n="mixCap"></span><span class="dd-value" id="mix-value"></span></span>
            <span class="dd-arrow" aria-hidden="true">&#9662;</span>
          </button>
          <div class="dd-panel" id="mix-panel"><div class="dd-inner"><ul class="opt-list" id="mix-list" role="radiogroup" aria-labelledby="mix-title"></ul></div></div>
        </div>
        <div class="card tone-scen" id="scen-card">
          <h2 id="scen-title"><span class="icon" aria-hidden="true">&#10026;</span><span data-i18n="scenTitle"></span></h2>
          <button type="button" class="dd-toggle" id="scen-toggle" aria-expanded="false" aria-controls="scen-panel">
            <span class="dd-text"><span class="dd-cap" data-i18n="scenCap"></span><span class="dd-value" id="scen-value"></span></span>
            <span class="dd-arrow" aria-hidden="true">&#9662;</span>
          </button>
          <div class="dd-panel" id="scen-panel"><div class="dd-inner"><ul class="opt-list" id="scen-list" role="radiogroup" aria-labelledby="scen-title"></ul></div></div>
        </div>
        <div class="card tone-makam" id="makam-card">
          <h2 id="makam-title"><span class="icon" aria-hidden="true">&#9790;</span><span data-i18n="makamTitle"></span></h2>
          <button type="button" class="dd-toggle" id="makam-toggle" aria-expanded="false" aria-controls="makam-panel">
            <span class="dd-text"><span class="dd-cap" data-i18n="makamCap"></span><span class="dd-value" id="makam-value"></span></span>
            <span class="dd-arrow" aria-hidden="true">&#9662;</span>
          </button>
          <div class="dd-panel" id="makam-panel"><div class="dd-inner"><ul class="opt-list" id="makam-list" role="radiogroup" aria-labelledby="makam-title"></ul></div></div>
        </div>
        <div class="card tone-nota" id="nota-card">
          <h2 id="nota-title"><span class="icon" aria-hidden="true">&#9839;</span><span data-i18n="notaTitle"></span></h2>
          <button type="button" class="dd-toggle" id="nota-toggle" aria-expanded="false" aria-controls="nota-panel">
            <span class="dd-text"><span class="dd-cap" data-i18n="notaCap"></span><span class="dd-value" id="nota-value"></span></span>
            <span class="dd-arrow" aria-hidden="true">&#9662;</span>
          </button>
          <div class="dd-panel" id="nota-panel"><div class="dd-inner"><ul class="opt-list" id="nota-list" role="radiogroup" aria-labelledby="nota-title"></ul></div></div>
        </div>
      </div>
      <div class="next-wrap"><button type="button" class="btn-lg next-btn" id="next-4" disabled></button></div>
    </section>
    <section class="step" id="s5" aria-labelledby="s5-title">
      <div class="top-bar"><button type="button" id="back-5"></button></div>
      <h2 id="s5-title" tabindex="-1"><span class="icon" aria-hidden="true">&#9654;</span><span data-i18n="s5title"></span></h2>
      <div class="card">
        <h2 data-i18n="summaryTitle"></h2>
        <ul class="summary-list" id="summary-list"></ul>
      </div>
      <div id="gen-loader" class="card" role="status" aria-live="polite">
        <span class="sr-only" id="gen-sr"></span>
        <div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <p class="loader-text" id="loader-text" aria-hidden="true"></p>
      </div>
      <div id="gen-result">
        <div class="card">
          <div class="block-head">
            <h2 id="res-title1">Sound Prompt</h2>
            <button type="button" class="copy-btn" id="copy-sound"></button>
          </div>
          <label class="prompt-label" for="out-style" data-i18n="soundLabel"></label>
          <textarea class="prompt-box" id="out-style" readonly aria-labelledby="res-title1"></textarea>
        </div>
        <div class="card">
          <div class="block-head">

  }

  DD.forEach(function (d) {
    $(d.p + "-toggle").addEventListener("click", function () {
      setOpen(d.p, !$(d.p + "-panel").classList.contains("open"), true);
    });
    $(d.p + "-toggle").addEventListener("keydown", function (e) {
      if (e.key === "Escape") { setOpen(d.p, false, true); focusEl($(d.p + "-toggle")); }
    });
  });

  function refreshSelectedLines() {
    var vs = $("vocal-sel");
    if (state.vocal === "yes") { vs.textContent = T().vocalSelYes; vs.classList.add("is-set"); }
    else if (state.vocal === "no") { vs.textContent = T().vocalSelNo; vs.classList.add("is-set"); }
    else { vs.textContent = T().vocalNone; vs.classList.remove("is-set"); }
  }

  function setVocal(value) {
    state.vocal = value;
    $("vocal-yes").setAttribute("aria-checked", value === "yes" ? "true" : "false");
    $("vocal-no").setAttribute("aria-checked", value === "no" ? "true" : "false");
    if (value === "yes") {
      $("vt-toggle").disabled = false;
      $("vt-note").textContent = T().vtNoteYes;
      announce(T().vocalOnSel);
    } else {
      state.vt = null;
      $("vt-toggle").disabled = true;
      setOpen("vt", false, false);
      $("vt-note").textContent = T().vtNoteNo;
      announce(T().vocalOffSel);
    }
    play("select");
    renderDropdown(DD[3]);
    refreshSelectedLines();
    updateNext3();
  }
  $("vocal-yes").addEventListener("click", function () { setVocal("yes"); });
  $("vocal-no").addEventListener("click", function () { setVocal("no"); });

  function updateNext2() { $("next-2").disabled = !(state.tempo && state.mood); }
  function updateNext3() {
    var vocalOk = state.vocal === "no" || (state.vocal === "yes" && state.vt);
    $("next-3").disabled = !(state.vocal && state.fx && vocalOk);
  }
  function updateNext4() { $("next-4").disabled = !(state.mix && state.scen); }

  // ---------- Dil ----------
  function applyLanguage() {
    var t = T();
    document.documentElement.lang = lang;
    $("lang-tr").setAttribute("aria-pressed", lang === "tr" ? "true" : "false");
    $("lang-en").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
    $("tagline").textContent = t.tagline;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (typeof t[k] === "string") el.textContent = t[k];
    });
    $("vocal-yes-t").textContent = t.vocalYesT; $("vocal-yes-d").textContent = t.vocalYesD;
    $("vocal-no-t").textContent = t.vocalNoT; $("vocal-no-d").textContent = t.vocalNoD;
    $("vt-note").textContent = state.vocal === "yes" ? t.vtNoteYes : (state.vocal === "no" ? t.vtNoteNo : t.vtNoteLocked);
    $("s4-note").textContent = t.s4note;
    $("back-2").textContent = t.back; $("back-3").textContent = t.back; $("back-4").textContent = t.back; $("back-5").textContent = t.back;
    $("next-1").textContent = t.next; $("next-2").textContent = t.next; $("next-3").textContent = t.next;
    $("next-4").textContent = t.generate;
    $("reset-btn").textContent = t.reset;
    $("copy-sound").textContent = t.copySound; $("copy-lyrics").textContent = t.copyLyrics; $("copy-all").textContent = t.copyAll;
    $("gen-sr").textContent = t.genSr;
    $("s2-summary").textContent = state.genre ? (t.genreCap + ": " + titleOf(state.genre.opt)) : "";
    DD.forEach(renderDropdown);
    refreshSelectedLines();
    renderStepper();
    renderProgress();
    if ($("gen-result").classList.contains("active")) buildOutputs();
    if (currentStep === 5) fillSummary();
  }

  function renderStepper() {
    var ol = $("stepper");
    ol.innerHTML = "";
    T().stepLabels.forEach(function (label, i) {
      var li = document.createElement("li");
      var n = i + 1;
      li.className = n < currentStep ? "done" : (n === currentStep ? "current" : "");
      li.innerHTML = '<span class="n">' + n + "</span>" + label;
      ol.appendChild(li);
    });
  }
  function renderProgress() { $("progress").textContent = T().progress(currentStep); }

  function setLang(next) {
    if (next === lang) return;
    lang = next;
    applyLanguage();
    play("step");
    announce(T().langLabel + ": " + (lang === "tr" ? "T\u00fcrk\u00e7e" : "English"));
  }
  $("lang-tr").addEventListener("click", function () { setLang("tr"); });
  $("lang-en").addEventListener("click", function () { setLang("en"); });

  // ---------- Adim gecisleri ----------
  function showStep(n, withSound) {
    currentStep = n;
    for (var i = 1; i <= TOTAL; i++) { $("s" + i).classList.toggle("active", i === n); }
    renderStepper();
    renderProgress();
    if (n === 2) $("s2-summary").textContent = state.genre ? (T().genreCap + ": " + titleOf(state.genre.opt)) : "";
    if (withSound) play("step");
    focusEl($("s" + n + "-title"));
  }

  // ---------- Prompt uretimi ----------
  function buildSoundPrompt() {
    var parts = [];
    parts.push(EN.genre[state.genre.id]);
    parts.push(EN.mood[state.mood.id]);
    if (state.vocal === "yes") { parts.push("lead vocals"); parts.push(EN.vt[state.vt.id]); }
    else { parts.push("instrumental, no vocals"); }
    parts.push(EN.fx[state.fx.id]);
    if (state.nota) parts.push(EN.nota[state.nota.id]);
    if (state.makam) parts.push(EN.makam[state.makam.id]);
    parts.push(EN.mix[state.mix.id]);
    parts.push(EN.scen[state.scen.id]);
    parts.push("professional mix and master, clean stereo image");
    var bpm = bpmOf(state.tempo.opt);
    var line = parts.join(", ");
    line += bpm ? ", " + bpm + " bpm" : ", free tempo";
    return line;
  }

  function capFirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function buildLyrics() {
    var out = [];
    var l = LYR[state.scen.id];
    var fxDesc = capFirst(EN.fx[state.fx.id]);
    if (state.vocal === "yes") {
      out.push("[Intro] (" + fxDesc + ", fading in)");
      out.push("");
      out.push("[Verse 1]");
      out.push(VOCAL_TAG[state.vt.id]);
      l.v1.forEach(function (s) { out.push(s); });
      out.push("");
      out.push("[Pre-Chorus]");
      l.pre.forEach(function (s) { out.push(s); });
      out.push("");
      out.push("[Chorus]");
      l.ch.forEach(function (s) { out.push(s); });
      out.push("");
      out.push("[Verse 2]");
      l.v2.forEach(function (s) { out.push(s); });
      out.push("");
      out.push("[Bridge]");
      l.br.forEach(function (s) { out.push(s); });
      out.push("");
      out.push("[Chorus]");
      l.ch.forEach(function (s) { out.push(s); });
      out.push("");
      out.push("[Outro]");
      out.push(l.out);
      out.push("");
      out.push("[End - 2:35]");
    } else {
      out.push("[Intro] (Deep atmospheric buildup, vinyl crackle)");
      out.push("");
      out.push("[Build-Up]");
      out.push("(" + fxDesc + ", layers entering one by one)");
      out.push("");
      out.push("[Main Groove]");
      out.push("(" + (state.makam ? EN.makam[state.makam.id] : EN.mood[state.mood.id]) + ")");
      out.push("");
      out.push("[Break & Drop]");
      out.push("(Sudden silence, then heavy low-end impact)");
      out.push("");
      out.push("[Outro]");
      out.push("(Slow fade, last loop dissolving)");
      out.push("");
      out.push("[End - 2:40]");
    }
    return out.join("\n");
  }

  function buildOutputs() {
    $("out-style").value = "Sound Prompt:\n" + buildSoundPrompt();
    $("out-lyrics").value = "Lyrics:\n" + buildLyrics();
  }

  function fillSummary() {
    var t = T();
    var list = $("summary-list");
    list.innerHTML = "";
    var rows = [
      [t.sumGenre, state.genre && titleOf(state.genre.opt)],
      [t.sumTempo, state.tempo && titleOf(state.tempo.opt)],
      [t.sumMood, state.mood && titleOf(state.mood.opt)],
      [t.sumVocal, state.vocal === "yes" ? t.vocalYesShort : (state.vocal === "no" ? t.vocalNoShort : null)],
      [t.sumVt, state.vocal === "yes" ? (state.vt && titleOf(state.vt.opt)) : t.notRequired],
      [t.sumFx, state.fx && titleOf(state.fx.opt)],
      [t.sumMix, state.mix && titleOf(state.mix.opt)],
      [t.sumScen, state.scen && titleOf(state.scen.opt)],
      [t.sumMakam, state.makam ? titleOf(state.makam.opt) : t.notSelected],
      [t.sumNota, state.nota ? titleOf(state.nota.opt) : t.notSelected]
    ];
    rows.forEach(function (r) {
      var li = document.createElement("li");
      var k = document.createElement("span"); k.className = "k"; k.textContent = r[0] + ": ";
      li.appendChild(k);
      li.appendChild(document.createTextNode(r[1] || t.notGiven));
      list.appendChild(li);
    });
  }

  var loaderMsgTimer = null, resultTimer = null;

  function startGeneration() {
    if (!state.mix || !state.scen) { announce(T().needRequired); return; }
    showStep(5, true);
    fillSummary();
    var res = $("gen-result");
    res.classList.remove("active"); res.style.display = "none";
    var loader = $("gen-loader");
    loader.classList.add("active"); loader.style.display = "block";
    var msgs = T().loaderMsgs, idx = 0;
    $("loader-text").textContent = msgs[0];
    clearInterval(loaderMsgTimer);
    loaderMsgTimer = setInterval(function () {
      idx = (idx + 1) % msgs.length;
      $("loader-text").textContent = msgs[idx];
    }, 600);
    announce(T().genSr);
    clearTimeout(resultTimer);
    resultTimer = setTimeout(finishGeneration, 1800);
  }

  function finishGeneration() {
    clearInterval(loaderMsgTimer);
    var loader = $("gen-loader");
    loader.classList.remove("active"); loader.style.display = "none";
    buildOutputs();
    var res = $("gen-result");
    res.style.display = "block";
    res.classList.add("active");
    announce(T().promptReady);
    focusEl($("res-title1"));
  }

  // ---------- Kopyalama ----------
  function copyText(text, onDone) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "absolute";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) onDone(); else announce(T().copyFail);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onDone, fallback);
    } else {
      fallback();
    }
  }

  var copyTimers = {};
  function bindCopy(btnId, getText) {
    var btn = $(btnId);
    btn.addEventListener("click", function () {
      copyText(getText(), function () {
        var label = btn.getAttribute("data-label") || btn.textContent;
        btn.setAttribute("data-label", label);
        btn.textContent = T().copied;
        btn.classList.add("copied");
        play("copy");
        announce(T().copiedMsg);
        clearTimeout(copyTimers[btnId]);
        copyTimers[btnId] = setTimeout(function () {
          btn.textContent = btn.getAttribute("data-label");
          btn.classList.remove("copied");
        }, 2000);
      });
    });
  }
  bindCopy("copy-sound", function () { return $("out-style").value; });
  bindCopy("copy-lyrics", function () { return $("out-lyrics").value; });
  bindCopy("copy-all", function () { return $("out-style").value + "\n\n" + $("out-lyrics").value; });

  // ---------- Sifirla ----------
  function resetAll() {
    state = { genre: null, tempo: null, mood: null, vocal: null, vt: null, fx: null, mix: null, scen: null, makam: null, nota: null };
    $("vocal-yes").setAttribute("aria-checked", "false");
    $("vocal-no").setAttribute("aria-checked", "false");
    $("vt-toggle").disabled = true;
    $("next-1").hidden = true;
    $("next-2").disabled = true;
    $("next-3").disabled = true;
    $("next-4").disabled = true;
    $("out-style").value = "";
    $("out-lyrics").value = "";
    var res = $("gen-result"); res.style.display = "none"; res.classList.remove("active");
    var loader = $("gen-loader"); loader.style.display = "none"; loader.classList.remove("active");
    clearTimeout(resultTimer);
    clearInterval(loaderMsgTimer);
    ["copy-sound", "copy-lyrics", "copy-all"].forEach(function (id) {
      var b = $(id); b.classList.remove("copied");
      if (b.getAttribute("data-label")) b.textContent = b.getAttribute("data-label");
    });
    DD.forEach(function (d) { setOpen(d.p, false, false); renderDropdown(d); });
    refreshSelectedLines();
    $("vt-note").textContent = T().vtNoteLocked;
    $("s2-summary").textContent = "";
    showStep(1, false);
    announce(T().resetDone);
  }

  // ---------- Baglantilar ----------
  $("next-1").addEventListener("click", function () {
    if (!state.genre) { announce(T().needGenre); return; }
    showStep(2, true);
  });
  $("next-2").addEventListener("click", function () {
    if (!state.tempo || !state.mood) { announce(T().needTempoMood); return; }
    showStep(3, true);
  });
  $("next-3").addEventListener("click", function () {
    if ($("next-3").disabled) { announce(T().needVocal); return; }
    showStep(4, true);
  });
  $("next-4").addEventListener("click", startGeneration);
  $("reset-btn").addEventListener("click", resetAll);
  $("back-2").addEventListener("click", function () { showStep(1, true); });
  $("back-3").addEventListener("click", function () { showStep(2, true); });
  $("back-4").addEventListener("click", function () { showStep(3, true); });
  $("back-5").addEventListener("click", function () { showStep(4, true); });

  $("vt-toggle").disabled = true;
  applyLanguage();
})();
</script>
</body>
</html>
